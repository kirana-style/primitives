name: ci

# What a pull request must keep true: the workspace checks itself (format, lint with types,
# tests), every adapter's fixture builds, and the conformance run passes: one set of scenarios on
# every adapter in a real browser, the DOM of each state the same across them. The push to `main`
# keeps the caches warm: only `main` saves them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first one's answer worthless, so
# stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner images are pinned, not `*-latest`: a label that moves changes the build under us.

jobs:
  check:
    runs-on: ubuntu-26.04
    name: lint, format, types and tests
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Separate steps so a red build names the stage that failed. The same checks run in the
      # pre-push hook (`vp run prepush`).
      - name: Format
        run: vp fmt --check

      # Oxlint and the TypeScript type check (tsgolint) in the same pass. A warning fails it, like
      # an error: `vp run check` does the same.
      - name: Lint and types
        run: vp lint --deny-warnings

      # Vue's and Svelte's templates, which the pass above does not read.
      - name: Template types
        run: vp run types

      # The core's reactivity, and the React adapter rendered on a server with no DOM. (The
      # core's services run in a browser, with the conformance job.)
      - name: Tests
        run: vp run test

      # Every adapter exports the same components, parts and entries.
      - name: Export parity
        run: vp run parity
      - name: llms.txt is current
        run: vp run llms

      # The packages as they would be published, installed into an empty project: every export
      # loads, renders on a server and type-checks.
      - name: Packages
        run: vp run pack

      # The release path against a registry of its own: nothing here reaches npm.
      - name: Release rehearsal
        run: vp run rehearse

  # Once for each engine, side by side, and the two slow engines in four shares each: Firefox and
  # WebKit play one subject at a time, and took 24 and 34 minutes whole, which was the wait for a
  # pull request. A share plays the subject the others are compared with and a quarter of the
  # rest (`--shard`), so the shares together are the whole run. Chromium plays six at once and
  # stays whole.
  conformance:
    runs-on: ubuntu-26.04
    name: build and conformance (${{ matrix.browser }} ${{ matrix.shard }})
    # A share takes six to eight minutes of this, measured; the rest is room for the browsers'
    # install to be tried again.
    timeout-minutes: 30
    strategy:
      # One engine's failure does not hide what the others would have said.
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: 1/1, part: 1 }
          - { browser: firefox, shard: 1/4, part: 1 }
          - { browser: firefox, shard: 2/4, part: 2 }
          - { browser: firefox, shard: 3/4, part: 3 }
          - { browser: firefox, shard: 4/4, part: 4 }
          - { browser: webkit, shard: 1/4, part: 1 }
          - { browser: webkit, shard: 2/4, part: 2 }
          - { browser: webkit, shard: 3/4, part: 3 }
          - { browser: webkit, shard: 4/4, part: 4 }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          scope: -${{ matrix.browser }}

      # Each adapter's fixture. Angular's compiler checks its adapter here (`ngc`), and Svelte's
      # compiles its files.
      - name: Build
        run: vp run build

      # The browsers Playwright drives, at the versions the lockfile's Playwright asks for. It
      # takes half a minute, and stalls now and then when many jobs fetch at once (one sat here
      # for twenty minutes until its job was stopped, three others for four to eleven): a try
      # that has not finished in three minutes is stopped and made again.
      - name: Browsers
        run: |
          for attempt in 1 2 3 4; do
            if timeout --kill-after=10 180 bunx playwright install --with-deps ${{ matrix.browser }}; then
              exit 0
            fi
            echo "::warning::installing ${{ matrix.browser }} did not finish, attempt $attempt"
          done
          exit 1

      # The core's services on their own, with no framework: focus, layers, presence, hover,
      # positioning, in this job's engine. Once for each engine, in its first share.
      - name: Core services
        if: matrix.part == 1
        env:
          BROWSERS: ${{ matrix.browser }}
        run: vp run browser

      # This job's share of the run in its engine, on the fixtures built above. Chromium plays
      # several pages at once; Firefox and WebKit one at a time (the run's own defaults).
      - name: Conformance
        run: bun tests/conformance/run.ts --browser ${{ matrix.browser }} --shard ${{ matrix.shard }}

      # What each adapter drew, state by state, when the comparison fails.
      - name: Keep the recorded states
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-${{ matrix.browser }}-${{ matrix.part }}
          path: tests/conformance/out
          retention-days: 7

      # Sizes do not depend on the engine: once.
      - name: Budgets
        if: matrix.browser == 'chromium'
        run: vp run budgets

  # The one check branch protection requires from this workflow, so adding or renaming a job never
  # changes the ruleset. It always runs, and passes when every job passed or was skipped.
  result:
    name: ci result
    if: always()
    needs: [check, conformance]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a job ended in $result"; exit 1 ;;
            esac
          done
