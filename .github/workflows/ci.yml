name: ci

# What a pull request must keep true: the workspace checks itself (format, lint with types,
# tests), every adapter's fixture builds (once, for every job that plays it), and the conformance
# run passes: one set of scenarios on every adapter in a real browser, the DOM of each state the
# same across them. The push to `main` keeps the caches warm: only `main` saves them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first one's answer worthless, so
# stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner images are pinned, not `*-latest`: a label that moves changes the build under us.

jobs:
  check:
    runs-on: ubuntu-26.04
    name: lint, format, types and tests
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Separate steps so a red build names the stage that failed. The same checks run in the
      # pre-push hook (`vp run prepush`).
      - name: Format
        run: vp fmt --check

      # Oxlint and the TypeScript type check (tsgolint) in the same pass. A warning fails it, like
      # an error: `vp run check` does the same.
      - name: Lint and types
        run: vp lint --deny-warnings

      # Vue's and Svelte's templates, which the pass above does not read.
      - name: Template types
        run: vp run types

      # The core's reactivity, and the React adapter rendered on a server with no DOM. (The
      # core's services run in a browser, with the conformance job.)
      - name: Tests
        run: vp run test

      # Every adapter exports the same components, parts and entries.
      - name: Export parity
        run: vp run parity
      - name: llms.txt is current
        run: vp run llms

      # The packages as they would be published, installed into an empty project: every export
      # loads, renders on a server and type-checks.
      - name: Packages
        run: vp run pack

      # The release path against a registry of its own: nothing here reaches npm.
      - name: Release rehearsal
        run: vp run rehearse

  # Each adapter's fixture, built once for every conformance job below: they used to build it
  # themselves, the same six pages on fourteen machines. Angular's compiler checks its adapter
  # here (`ngc`), and Svelte's compiles its files.
  build:
    runs-on: ubuntu-26.04
    name: build the fixtures
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build
        run: vp run build

      # The pages the run serves, each adapter's `dist` (the page, its server-rendered twin and
      # React's strict build inside it): a few megabytes, wanted only by this run's own jobs.
      - name: Keep the built fixtures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixtures
          path: fixtures/*/dist
          if-no-files-found: error
          retention-days: 1

  # Once for each engine, side by side, each in shares: Firefox and WebKit play one subject at a
  # time, and took 24 and 34 minutes whole, which was the wait for a pull request. A share plays
  # the subject the others are compared with and its part of the rest (`--shard`), so the shares
  # together are the whole run. Chromium plays six at once, in two shares; the other two in six.
  conformance:
    needs: build
    runs-on: ubuntu-26.04
    name: conformance (${{ matrix.browser }} ${{ matrix.shard }})
    # A share takes a few minutes of this; the rest is room for the browsers' install to be
    # tried again.
    timeout-minutes: 30
    strategy:
      # One engine's failure does not hide what the others would have said.
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: 1/2, part: 1 }
          - { browser: chromium, shard: 2/2, part: 2 }
          - { browser: firefox, shard: 1/6, part: 1 }
          - { browser: firefox, shard: 2/6, part: 2 }
          - { browser: firefox, shard: 3/6, part: 3 }
          - { browser: firefox, shard: 4/6, part: 4 }
          - { browser: firefox, shard: 5/6, part: 5 }
          - { browser: firefox, shard: 6/6, part: 6 }
          - { browser: webkit, shard: 1/6, part: 1 }
          - { browser: webkit, shard: 2/6, part: 2 }
          - { browser: webkit, shard: 3/6, part: 3 }
          - { browser: webkit, shard: 4/6, part: 4 }
          - { browser: webkit, shard: 5/6, part: 5 }
          - { browser: webkit, shard: 6/6, part: 6 }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          scope: -${{ matrix.browser }}

      # The pages the `build` job made, put back where the run serves them from.
      - name: Fetch the built fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures
          path: fixtures

      # The system libraries the browser needs, from the runner's package mirror. apt is never
      # stopped from outside: it runs as root, so a stopped try left its `apt-get` behind holding
      # the package lock, and every later try failed on that lock. It is told instead to give up
      # on a mirror that goes silent, to fetch again, and to wait for the lock.
      - name: Browser libraries
        run: |
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/80-ci > /dev/null
          for attempt in 1 2 3; do
            if bunx playwright install-deps ${{ matrix.browser }}; then
              exit 0
            fi
            echo "::warning::installing ${{ matrix.browser }}'s libraries failed, attempt $attempt"
            sleep 15
          done
          exit 1

      # The browser Playwright drives, at the version the lockfile's Playwright asks for: a
      # download of half a minute that stalls now and then when many jobs fetch at once (one sat
      # here for twenty minutes until its job was stopped, three others for four to eleven). A
      # try that has not finished in three minutes is stopped and made again; it is the job's
      # own process, so stopping it leaves nothing behind.
      - name: Browsers
        run: |
          for attempt in 1 2 3 4; do
            if timeout --kill-after=10 180 bunx playwright install ${{ matrix.browser }}; then
              exit 0
            fi
            echo "::warning::installing ${{ matrix.browser }} did not finish, attempt $attempt"
          done
          exit 1

      # The core's services on their own, with no framework: focus, layers, presence, hover,
      # positioning, in this job's engine. Once for each engine, in its first share.
      - name: Core services
        if: matrix.part == 1
        env:
          BROWSERS: ${{ matrix.browser }}
        run: vp run browser

      # This job's share of the run in its engine, on the fixtures fetched above. Chromium plays
      # several pages at once; Firefox and WebKit one at a time (the run's own defaults).
      - name: Conformance
        run: bun tests/conformance/run.ts --browser ${{ matrix.browser }} --shard ${{ matrix.shard }}

      # What each adapter drew, state by state, when the comparison fails.
      - name: Keep the recorded states
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-${{ matrix.browser }}-${{ matrix.part }}
          path: tests/conformance/out
          retention-days: 7

      # Sizes do not depend on the engine: once.
      - name: Budgets
        if: matrix.browser == 'chromium' && matrix.part == 1
        run: vp run budgets

  # The one check branch protection requires from this workflow, so adding or renaming a job never
  # changes the ruleset. It always runs, and passes when every job passed or was skipped.
  result:
    name: ci result
    if: always()
    needs: [check, build, conformance]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a job ended in $result"; exit 1 ;;
            esac
          done
